name: Generate ModNet experiment files

on:
  workflow_dispatch:
  push:
    paths:
      - 'ModNet.py'
      - '.github/workflows/generate-results.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  generate:
    name: Run experiments and upload results
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare output directory
        run: mkdir -p results

      - name: Run ModNet experiments
        run: |
          set -euxo pipefail
          python ModNet.py
          ls -la
          find results -maxdepth 2 -type f | sort | head -200

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modnet-results-${{ github.run_number }}
          path: results/
          if-no-files-found: error
          retention-days: 30        uses: actions/upload-artifact@v4
        with:
          name: modnet-results-${{ github.run_number }}
          path: results/
          if-no-files-found: error
          retention-days: 30
