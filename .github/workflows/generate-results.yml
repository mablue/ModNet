name: Generate ModNet experiment files

on:
  workflow_dispatch:
  push:
    paths:
      - 'ModNet.py'
      - '.github/workflows/generate-results.yml'

permissions:
  contents: read

jobs:
  generate:
    name: Run experiments and upload results
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Run ModNet experiments
        run: python ModNet.py

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modnet-results-${{ github.run_number }}
          path: results/
          if-no-files-found: error
          retention-days: 30
